spring:
  application:
    name: springboot-resilience4j-demo

server:
  port: 8080

resilience4j:
      timelimiter:
        instances:
          doctorService:
            timeout-duration: 2s
            cancel-running-future: true	

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always